# RESTful server connection settings.
# Change these values, then rebuild (mvn clean package) and redeploy the client.

# IP or host name of the machine running the RESTful server.
# Use localhost only when the server runs on this same machine.
ws.host=localhost

# HTTP port of the Payara instance hosting the server.
ws.port=8080

# Context root of the deployed server application (case-sensitive).
ws.context=WS_EUREKABANK_JAVA_RESTFul
