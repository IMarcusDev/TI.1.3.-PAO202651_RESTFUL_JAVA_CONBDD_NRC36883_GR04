# Dirección del servidor RESTful.
#
# Cuando el servidor esté en otra computadora, cambiá SOLO ws.host (la IP) y ws.port (el puerto).
# No hace falta recompilar: editá este mismo archivo junto al jar (Maven lo copia a target/) y volvé
# a abrir la aplicación. También podés indicar otro archivo con:
#   java -Dcliente.config=C:\ruta\config.properties -jar ESC_EUREKABANK_JAVA_RESTful.jar
#
# ws.host + ws.port + ws.context forman la URL base de la API:
#   http://localhost:8080/WS_EUREKABANK_JAVA_RESTFul/api
ws.host=localhost
ws.port=8080
# Nombre de la aplicación desplegada en el servidor: no cambia al mover el servidor de computadora.
ws.context=WS_EUREKABANK_JAVA_RESTFul
